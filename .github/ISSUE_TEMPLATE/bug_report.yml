name: Bug report
description: Report reproducible incorrect behavior in NetWatch Lite.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private endpoints, or real inventory.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using safe sample data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, .NET version, browser, and deployment type.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add safe logs or screenshots with sensitive data removed.

