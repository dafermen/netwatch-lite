name: Feature request
description: Propose an improvement within the NetWatch Lite scope.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Expected impact
      options:
        - label: API or data contract
        - label: Security or identity
        - label: Deployment or operations
        - label: User interface
        - label: Testing strategy

