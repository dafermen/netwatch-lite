<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetWatch Lite Wallboard</title>
  <link rel="icon" type="image/svg+xml" href="/netwatch-lite.svg">
  <link href="/wallboard.css" rel="stylesheet">
</head>
<body>
  <header class="wallboard-topbar">
    <div class="wallboard-controls" aria-label="Wallboard controls">
      <button class="wallboard-button" type="button" id="layout-4">4 Panels</button>
      <button class="wallboard-button" type="button" id="layout-2">2 Panels</button>
      <button class="wallboard-button" type="button" id="refresh-all">Refresh</button>
      <label class="wallboard-check">
        <input type="checkbox" id="rotation-toggle">
        Auto
      </label>
    </div>

    <h1 id="wallboard-title">NetWatch Lite Wallboard</h1>

    <div class="wallboard-status">
      <span id="page-indicator">Page 1 / 1</span>
      <span>F: Fullscreen · R: Refresh · ESC: Exit</span>
      <button class="wallboard-button compact" type="button" id="reload-config">Reload JSON</button>
    </div>
  </header>

  <main class="wallboard-main">
    <section class="panel-grid layout-4" id="panel-grid" aria-label="Monitoring panels"></section>
  </main>

  <div class="wallboard-toast" id="wallboard-toast" hidden></div>

  <script src="/wallboard.js"></script>
</body>
</html>
